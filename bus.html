<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3A · Fu Tai Estate → Shenzhen Bay Port</title>
<style>
  :root {
    --bg: #0a0e13;
    --card: rgba(255, 255, 255, 0.045);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f2f5f8;
    --muted: #8b97a6;
    --accent: #ffd23f;
    --accent-soft: rgba(255, 210, 63, 0.12);
    --danger: #ff7a6b;
    --radius: 24px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(255, 210, 63, 0.10), transparent 60%),
      radial-gradient(700px 500px at 110% 110%, rgba(70, 140, 255, 0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(100%, 520px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 22px 0;
    box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.9);
    overflow: hidden;
    position: relative;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    gap: 14px;
    align-items: center;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .route {
    flex: 0 0 auto;
    min-width: 68px;
    padding: 10px 8px;
    border-radius: 14px;
    background: var(--accent);
    color: #17130a;
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1;
  }

  .headline { min-width: 0; }

  h1 {
    margin: 0;
    font-size: 1.02rem;
    font-weight: 650;
    line-height: 1.3;
    letter-spacing: -0.01em;
  }

  h1 .arrow { color: var(--accent); margin: 0 4px; }

  .sub {
    margin: 3px 0 0;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* ---------- list ---------- */
  .section-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 2px 8px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.bus {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    animation: rise 0.35s ease both;
  }

  li.bus:last-child { border-bottom: 0; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  .when {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 0.98rem;
    font-weight: 550;
    color: #d8e0e9;
  }

  .note {
    font-size: 0.74rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 230px;
  }

  .mins {
    display: flex;
    align-items: baseline;
    gap: 5px;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  .num {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .unit {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  li.bus.primary .num {
    font-size: 2.9rem;
    color: var(--accent);
  }

  li.bus.primary .clock { font-size: 1.05rem; }

  .mins.due .num {
    font-size: 2.1rem;
    color: var(--accent);
  }

  li.bus.primary .mins.due .num { font-size: 2.9rem; }

  /* ---------- states ---------- */
  .state {
    padding: 34px 8px 40px;
    text-align: center;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .state strong {
    display: block;
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .skeleton {
    height: 46px;
    margin: 6px 0;
    border-radius: 12px;
    list-style: none;
    background: linear-gradient(90deg, rgba(255,255,255,0.045), rgba(255,255,255,0.09), rgba(255,255,255,0.045));
    background-size: 220% 100%;
    animation: shimmer 1.3s linear infinite;
  }

  @keyframes shimmer {
    from { background-position: 130% 0; }
    to   { background-position: -30% 0; }
  }

  /* ---------- footer ---------- */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding: 14px 2px 16px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.16);
    flex: 0 0 auto;
  }

  .dot.warn { background: var(--danger); box-shadow: 0 0 0 3px rgba(255, 122, 107, 0.16); }
  .dot.load { background: var(--accent); box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.16); }

  button {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    flex: 0 0 auto;
  }

  button:hover { background: rgba(255, 255, 255, 0.1); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: default; }

  .timer {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 100%;
    background: var(--accent);
    opacity: 0.75;
    transform-origin: left center;
  }

  .timer.run { animation: drain 30s linear forwards; }

  @keyframes drain {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .timer { transform: none !important; opacity: 0.35; }
  }

  @media (max-width: 420px) {
    body { padding: 14px; }
    .card { padding: 18px 16px 0; }
    .route { min-width: 58px; font-size: 1.15rem; }
    h1 { font-size: 0.94rem; }
    .num { font-size: 1.7rem; }
    li.bus.primary .num { font-size: 2.5rem; }
    .note { max-width: 150px; }
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="route">B3A</div>
    <div class="headline">
      <h1>Fu Tai Estate <span class="arrow">→</span> Shenzhen Bay Port</h1>
      <p class="sub">富泰邨, 青山公路 → 深圳灣口岸 · Citybus</p>
    </div>
  </header>

  <div class="section-label">
    <span>Next buses</span>
    <span id="count"></span>
  </div>

  <ul id="list" aria-live="polite">
    <li class="skeleton"></li>
    <li class="skeleton"></li>
  </ul>

  <footer>
    <span class="status">
      <span class="dot load" id="dot"></span>
      <span id="status">Loading…</span>
    </span>
    <button id="refresh" type="button">Refresh</button>
  </footer>

  <div class="timer" id="timer"></div>
</main>

<script>
(function () {
  "use strict";

  var ROUTE = "B3A";
  var STOP = "003261";               // Fu Tai Estate, Castle Peak Road (outbound, seq 14)
  var API = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/" + STOP + "/" + ROUTE;
  var REFRESH_MS = 30000;

  var listEl = document.getElementById("list");
  var statusEl = document.getElementById("status");
  var dotEl = document.getElementById("dot");
  var countEl = document.getElementById("count");
  var btn = document.getElementById("refresh");
  var timerEl = document.getElementById("timer");

  var buses = [];          // [{ etaMs, rmk }]
  var loadedOnce = false;
  var busy = false;
  var lastGood = 0;
  var timerHandle = null;

  var hkTime = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });
  var hkStamp = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });

  function minutesUntil(ms) {
    var diff = ms - Date.now();
    if (diff < 60000) return 0;                 // under a minute away
    return Math.floor(diff / 60000);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    dotEl.className = "dot" + (kind ? " " + kind : "");
  }

  function startTimer() {
    timerEl.classList.remove("run");
    // force reflow so the animation restarts
    void timerEl.offsetWidth;
    timerEl.classList.add("run");
  }

  function render() {
    var now = Date.now();
    var upcoming = buses
      .filter(function (b) { return b.etaMs > now - 30000; })
      .sort(function (a, b) { return a.etaMs - b.etaMs; })
      .slice(0, 4);

    if (!upcoming.length) {
      listEl.innerHTML =
        '<li class="state"><strong>No upcoming departures</strong>' +
        'The next B3A has not been published yet. This page refreshes itself.</li>';
      countEl.textContent = "";
      document.title = "B3A · No departures";
      return;
    }

    countEl.textContent = upcoming.length + (upcoming.length === 1 ? " departure" : " departures");

    listEl.innerHTML = upcoming.map(function (b, i) {
      var mins = minutesUntil(b.etaMs);
      var due = mins === 0;
      var primary = i === 0;

      var minsHtml = due
        ? '<div class="mins due"><span class="num">Due</span></div>'
        : '<div class="mins"><span class="num">' + mins + '</span><span class="unit">min</span></div>';

      var note = b.rmk ? b.rmk : (due ? "Arriving now" : "→ Shenzhen Bay Port");

      return '<li class="bus' + (primary ? " primary" : "") + '" style="animation-delay:' +
        (i * 45) + 'ms">' +
        '<div class="when">' +
          '<span class="clock">' + hkTime.format(b.etaMs) + "</span>" +
          '<span class="note">' + esc(note) + "</span>" +
        "</div>" + minsHtml +
      "</li>";
    }).join("");

    var first = upcoming[0];
    var m = minutesUntil(first.etaMs);
    document.title = "B3A · " + (m === 0 ? "Due" : m + " min");
  }

  function paint() {
    // Re-render only when the displayed minute (or the bus set) changes.
    var sig = buses
      .filter(function (b) { return b.etaMs > Date.now() - 30000; })
      .sort(function (a, b) { return a.etaMs - b.etaMs; })
      .slice(0, 4)
      .map(function (b) { return b.etaMs + ":" + minutesUntil(b.etaMs); })
      .join("|");
    if (sig !== paint.last) {
      paint.last = sig;
      render();
    }
  }

  function load() {
    if (busy) return;
    busy = true;
    btn.disabled = true;
    if (!loadedOnce) setStatus("Loading…", "load");
    else startTimer();

    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var kill = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

    fetch(API + (API.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now(), {
      cache: "no-store",
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (json) {
        var rows = (json && json.data) || [];
        buses = rows
          .filter(function (r) { return r.dir === "O" || !r.dir; })
          .map(function (r) {
            var t = r.eta ? Date.parse(r.eta) : NaN;
            return {
              etaMs: t,
              rmk: (r.rmk_en || "").trim() ||
                   (r.rmk_tc || "").trim() ||
                   (r.eta ? "" : "No ETA available")
            };
          })
          .filter(function (b) { return isFinite(b.etaMs); });

        lastGood = Date.now();
        loadedOnce = true;
        paint.last = null;
        render();
        startTimer();
        setStatus("Updated " + hkStamp.format(lastGood) + " · every 30s", "ok");
      })
      .catch(function (err) {
        if (!loadedOnce) {
          listEl.innerHTML =
            '<li class="state"><strong>Could not reach the Citybus feed</strong>' +
            esc(err && err.message ? err.message : "Network error") +
            "<br>Retrying automatically in 30 seconds.</li>";
          document.title = "B3A · Offline";
        }
        setStatus(lastGood ? "Feed error · showing last data" : "Feed unavailable · retrying", "warn");
      })
      .then(function () {
        clearTimeout(kill);
        busy = false;
        btn.disabled = false;
      });
  }

  btn.addEventListener("click", function () {
    paint.last = null;
    load();
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && Date.now() - lastGood > REFRESH_MS) load();
  });

  setInterval(paint, 1000);          // live countdown between fetches
  setInterval(load, REFRESH_MS);     // data refresh every 30 seconds

  load();
})();
</script>
</body>
</html>
